name: Download local travel images

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ravin-local-images
  cancel-in-progress: false

jobs:
  download-images:
    if: "!contains(github.event.head_commit.message, '[skip image sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download optimized local JPG assets
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          assets = {
              'travel-cover.jpg': ('photo-1500530855697-b586d89ba3ee', 1600),
              'santorini.jpg': ('photo-1533105079780-92b9be482077', 2000),
              'venice.jpg': ('photo-1523906834658-6e24ef2386f9', 2000),
              'dubai.jpg': ('photo-1512453979798-5ea266f8880c', 2000),
              'tokyo.jpg': ('photo-1540959733332-eab4de215a89', 1000),
              'alps.jpg': ('photo-1530789253388-582c481c54b0', 1000),
              'maldives.jpg': ('photo-1514282401047-d79a71a590e8', 1000),
              'london.jpg': ('photo-1513635269975-59663e0ac1ad', 1000),
              'bangkok.jpg': ('photo-1508009603885-50cf7c579365', 1000),
              'istanbul.jpg': ('photo-1524231757912-21f4fe3a7200', 1200),
              'agra.jpg': ('photo-1564507592333-c60657eea523', 1000),
              'lake.jpg': ('photo-1476514525535-07fb3b4ae5f1', 1200),
          }
          folder = Path('assets/images')
          folder.mkdir(parents=True, exist_ok=True)
          for filename, (photo_id, width) in assets.items():
              url = f'https://images.unsplash.com/{photo_id}?auto=format&fit=crop&w={width}&q=84&fm=jpg'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  data = response.read()
              if len(data) < 5000:
                  raise RuntimeError(f'Image download too small: {filename} ({len(data)} bytes)')
              (folder / filename).write_bytes(data)
              print(f'{filename}: {len(data)} bytes')
          PY
      - name: Commit image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add local travel photography [skip image sync]'
            git push
          fi
